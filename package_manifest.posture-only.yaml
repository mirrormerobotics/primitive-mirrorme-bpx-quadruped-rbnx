manifestVersion: 1

package:
  name: robonix.primitive.mirrorme.bpx.quadruped
  version: 0.1.0-dev.2
  description: MirrorMe BPX odometry and guarded stand/sit posture provider for x86_64 with a Dockerized ROS 2 Humble runtime.
  tags: [primitive, quadruped, mirrorme, bpx, ros2, docker, x86-64, odom, posture]
  maintainers:
    - nonkr <nonkr@hotmail.com>
  license: Apache-2.0

build: bash scripts/build.sh
start: bash scripts/start-sdk-posture.sh
stop: bash scripts/stop.sh

capabilities:
  - name: robonix/primitive/quadruped/odom
  - name: robonix/primitive/quadruped/posture

depends: []
